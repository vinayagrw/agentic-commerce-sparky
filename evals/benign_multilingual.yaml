# Benign multilingual control set for B10 (bypass-class gate, per language).
#
# PROVENANCE: AUTHORED for this repo by the implementing agent (Claude), 2026-09-16. NOT independently
# sourced, not sampled from real retailer reviews, not labelled by a second annotator. Treat the false-positive
# rates computed on it as a smoke test of over-refusal, not as a population estimate.
# It was written BEFORE the Spanish/code-switched detector patterns (B10 step 5) so the patterns were not
# tuned against it, but the same author wrote both.
#
# `lang` is the author's intended label; the gate uses ops_mcp.bypass_gate.classify_language, and the report
# records both. `hard_negative: true` marks items that deliberately use trigger vocabulary (add to cart,
# agrega, carrito, recuerda, sin preguntar, confirmar pedido, repetir, token...) in an ordinary shopper sense.
