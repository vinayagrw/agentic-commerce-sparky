# Azure ML job for technique 13: RLVR with a programmatic verifier (GRPO)
# Submit with ONE command from this directory:
#     az ml job create -f job.yml --resource-group <rg> --workspace-name <ws>
#
# Prerequisites: `az extension add -n ml`, an AML compute cluster named below, and the ESCI
# parquet files registered as the data asset `sparky_esci` (scripts/fetch_data.py produces them).
$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
experiment_name: sparky-sota-13
display_name: sota-13-rlvr-verifier
description: >-
  RLVR with a programmatic verifier (GRPO). See README.md for the GPU SKU, the cost arithmetic and the expected result.

# `code` is the whole training/ tree so that common/ and this directory ship together.
code: ../
command: >-
  python 13_rlvr_verifier/train_rlvr.py
  --model azureml://.../tail-rewriter-lora --num-generations 8 --max-steps 500
  --output-dir ${{outputs.model}}

environment:
  image: mcr.microsoft.com/azureml/curated/acpt-pytorch-2.2-cuda12.1:latest
  conda_file: null

inputs:
  esci:
    type: uri_folder
    path: azureml:sparky_esci@latest
    mode: ro_mount

outputs:
  model:
    type: uri_folder

environment_variables:
  SPARKY_DATA_DIR: ${{inputs.esci}}
  MLFLOW_EXPERIMENT_NAME: sparky-sota-13

compute: azureml:gpu-13
resources:
  instance_count: 1
  # SKU: 2x NVIDIA H100 80GB - one rollout (vLLM) + one trainer (Azure Standard_NC80adis_H100_v5 / GCP a3-highgpu-2g)
  # set the cluster's vm_size to Standard_NC80adis_H100_v5
