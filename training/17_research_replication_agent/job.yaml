# Vertex AI CustomJob for technique 17: Research replication agent
# Submit with ONE command from this directory:
#     gcloud ai custom-jobs create --region=us-central1 \
#         --display-name=sota-17-research-replication-agent --config=job.yaml
#
# Prerequisites: a container image in Artifact Registry built from requirements.txt, and the
# ESCI parquet files in GCS at gs://<bucket>/sparky/data (scripts/fetch_data.py produces them).
workerPoolSpecs:
  - machineSpec:
      machineType: g2-standard-8
      acceleratorType: NVIDIA_L4
      acceleratorCount: 1
    replicaCount: 1
    diskSpec:
      bootDiskType: pd-ssd
      bootDiskSizeGb: 500
    containerSpec:
      imageUri: us-central1-docker.pkg.dev/PROJECT_ID/sparky/sota-17:latest
      command: ["python", "17_research_replication_agent/replicate.py"]
      args:
        - "--spec"
        - "task_spec.yaml"
        - "--backend"
        - "claude"
        - "--output-dir"
        - "/gcs/BUCKET/sparky/out/sota-17-research-replication-agent/results.json"
      env:
        - name: SPARKY_DATA_DIR
          value: "/gcs/BUCKET/sparky/data"
        - name: MLFLOW_EXPERIMENT_NAME
          value: "sparky-sota-17"

baseOutputDirectory:
  outputUriPrefix: gs://BUCKET/sparky/out/sota-17-research-replication-agent

# SKU: 1x NVIDIA L4 (GCP g2-standard-8) / 1x A10 (Azure Standard_NV36ads_A10_v5) in a T1 sandbox with egress limited to a package mirror
