# Vertex AI CustomJob for technique 11: LoRA / QLoRA tail-query rewriter
# Submit with ONE command from this directory:
#     gcloud ai custom-jobs create --region=us-central1 \
#         --display-name=sota-11-lora-qlora --config=job.yaml
#
# Prerequisites: a container image in Artifact Registry built from requirements.txt, and the
# ESCI parquet files in GCS at gs://<bucket>/sparky/data (scripts/fetch_data.py produces them).
workerPoolSpecs:
  - machineSpec:
      machineType: a2-ultragpu-1g
      acceleratorType: NVIDIA_A100_80GB
      acceleratorCount: 1
    replicaCount: 1
    diskSpec:
      bootDiskType: pd-ssd
      bootDiskSizeGb: 500
    containerSpec:
      imageUri: us-central1-docker.pkg.dev/PROJECT_ID/sparky/sota-11:latest
      command: ["python", "11_lora_qlora/train_lora.py"]
      args:
        - "--model"
        - "meta-llama/Llama-3.1-8B-Instruct"
        - "--qlora"
        - "--tail-only"
        - "--output-dir"
        - "/gcs/BUCKET/sparky/out/sota-11-lora-qlora/results.json"
      env:
        - name: SPARKY_DATA_DIR
          value: "/gcs/BUCKET/sparky/data"
        - name: MLFLOW_EXPERIMENT_NAME
          value: "sparky-sota-11"

baseOutputDirectory:
  outputUriPrefix: gs://BUCKET/sparky/out/sota-11-lora-qlora

# SKU: 1x NVIDIA A100 80GB (Azure Standard_NC24ads_A100_v4 / GCP a2-ultragpu-1g)
