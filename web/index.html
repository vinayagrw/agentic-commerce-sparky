<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
    <script>
      // Apply remembered theme + density before first paint (no flash). Storage may throw.
      // ?theme=light|dark|system and ?density=comfortable|presenter override and are remembered,
      // so a presenter can open a link straight into projector mode.
      try {
        var q = new URLSearchParams(location.search);
        if (q.has("theme")) localStorage.setItem("sparky.theme", q.get("theme"));
        if (q.has("density")) localStorage.setItem("sparky.density", q.get("density"));
      } catch (e) {}
      try {
        var t = localStorage.getItem("sparky.theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        var d = localStorage.getItem("sparky.density"); document.documentElement.setAttribute("data-density", d === "presenter" ? "presenter" : "comfortable");
      } catch (e) { document.documentElement.setAttribute("data-density", "comfortable"); }
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230071dc'/><path d='M50 18l8 24 24 8-24 8-8 24-8-24-24-8 24-8z' fill='%23ffc220'/></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
