[project]
name = "ops-mcp"
version = "0.1.0"
description = "Sparky Next MLOps plane: ops MCP server (agents run the search-model lifecycle) + ops-http approvals/guardrail app"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
    "datasketch>=1.6",
    "model-signing>=1.0",
    "cyclonedx-python-lib[json-validation]>=8",
    "shop-mcp",
]

[tool.uv.sources]
shop-mcp = { path = "../shop-mcp", editable = true }

[project.scripts]
ops-mcp = "ops_mcp.server:main"
ops-http = "ops_mcp.http_app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
