[project]
name = "shop-mcp"
version = "0.1.0"
description = "Sparky Next shop MCP server + commerce simulator (demo)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "opentelemetry-sdk>=1.27",
]

[project.scripts]
shop-mcp = "shop_mcp.server:main"
shop-http = "shop_mcp.http_app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shop_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
