[project]
name = "search-svc"
version = "0.1.0"
description = "Sparky Next search service: BM25 + dense + RRF + rerank over ESCI subset (synthetic commerce fields)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pandas>=2.2",
  "pyarrow>=16",
  "numpy<2.3",
  "bm25s>=0.2.6",
  "PyStemmer>=2.2",
  "sentence-transformers>=3.0",
  "faiss-cpu>=1.8",
  "requests>=2.32",
  "httpx>=0.27",
  "pytest>=8",
  "networkx>=3.3",
  "mlflow-skinny>=3",
  "sqlalchemy>=2",
  "alembic>=1.20.0",
  "opentelemetry-sdk>=1.27",
]
[tool.uv]
package = false
